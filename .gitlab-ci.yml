stages:
  - validate

backend-task4:
  stage: validate
  image: python:3.11
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
  script:
    - python -m compileall -q src tests
    - python -m pytest -q tests/test_closed_loop_task4.py tests/test_visual_persistence.py tests/test_visual_generation.py tests/test_visual_migrations.py

frontend-task4:
  stage: validate
  image: node:20
  cache:
    paths:
      - web/node_modules/
  before_script:
    - cd web
    - npm ci
  script:
    - npm test
    - npm run build
