stages:
  - test
  - web

python-tests:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc g++ libglib2.0-0 libgl1 && rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
  script:
    - pytest -q

web-build:
  stage: web
  image: node:20-bookworm-slim
  before_script:
    - npm --prefix web ci
  script:
    - npm --prefix web run build
    - npm --prefix web test
