name: T8 mainline acceptance

on:
  pull_request:
    paths:
      - "src/api/**"
      - "src/core/**"
      - "migrations/**"
      - "tests/**"
      - ".github/workflows/t8-mainline-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: t8-mainline-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  t8-mainline:
    name: T8-A/B/E mainline acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Install OCR language data
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng fonts-noto-cjk
      - name: Run T8 acceptance
        run: |
          python -m pytest -vv \
            tests/test_t8_diagnosis_api_acceptance.py \
            tests/test_t8_full_api_happy_path.py \
            tests/test_t8_master_plan_atomicity_api.py \
            tests/test_t8_b_worker_api_dispatch.py \
            tests/test_t8_content_lifecycle_api_acceptance.py \
            --durations=20 -o faulthandler_timeout=240
      - name: Compile backend sources
        run: python -m compileall -q src tests
