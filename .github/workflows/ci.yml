name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Install OCR language data
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          if ! command -v tesseract >/dev/null 2>&1; then
            packages+=(tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng)
          else
            if ! tesseract --list-langs 2>/dev/null | grep -qx chi_sim; then
              packages+=(tesseract-ocr-chi-sim)
            fi
            if ! tesseract --list-langs 2>/dev/null | grep -qx eng; then
              packages+=(tesseract-ocr-eng)
            fi
          fi
          if (("${#packages[@]}" > 0)); then
            echo "Installing missing OCR packages: ${packages[*]}"
            sudo timeout 240s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::ForceIPv4=true update
            sudo timeout 360s env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::ForceIPv4=true install -y --no-install-recommends "${packages[@]}"
          else
            echo "Tesseract OCR engine and required language data are already available; skipping apt installation."
          fi
      - name: Install Chromium for visual renderer tests
        timeout-minutes: 10
        run: python -m playwright install --with-deps chromium
      - name: Install required CJK visual fonts
        timeout-minutes: 15
        run: bash scripts/install_visual_fonts.sh
      - name: Run transaction regression tests
        timeout-minutes: 5
        run: python -m pytest -vv tests/test_request_transaction_nesting.py --durations=20 -o faulthandler_timeout=240
      - name: Run T8-D master-plan API reliability acceptance
        timeout-minutes: 5
        run: python -m pytest -vv tests/test_t8_master_plan_atomicity_api.py --durations=20 -o faulthandler_timeout=240
      - name: Run tests
        timeout-minutes: 15
        run: python -m pytest -vv --durations=20 -o faulthandler_timeout=240
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Lint security boundary imports and names
        run: ruff check --select F401,F821,F811 src/core/safe_http.py src/core/kb_sources.py src/core/hot_topics.py src/core/notify/__init__.py tests/test_access_and_sources.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run frontend unit tests
        working-directory: web
        run: npm test
      - name: Build production app
        working-directory: web
        run: npm run build
      - name: Ensure demo mock API is excluded from production bundle
        working-directory: web
        run: |
          if grep -R -n -E "installDemoApi|__iwDemoApi" dist/assets; then
            echo "Demo mock API leaked into production assets"
            exit 1
          fi
      - name: Build isolated offline demo
        working-directory: web
        run: npm run build:demo
      - name: Verify offline demo artifact
        working-directory: web
        run: test -s ../iterwave-prototype.html && grep -q "静态原型演示" ../iterwave-prototype.html

  visual-ui-browser:
    name: Visual task browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Install application and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" playwright
          python -m playwright install --with-deps chromium
      - name: Run real-browser task recovery and full-route viewport scenarios
        run: >-
          python -m pytest -vv
          --override-ini "python_files=visual_generation_browser.py responsive_viewport_browser.py structured_data_diagnostics_browser.py"
          web/browser_tests/visual_generation_browser.py
          web/browser_tests/responsive_viewport_browser.py
          web/browser_tests/structured_data_diagnostics_browser.py
      - name: Upload responsive viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-viewport-screenshots
          path: |
            test-results/responsive/
            test-results/structured-diagnostics/
          if-no-files-found: warn
          retention-days: 7
