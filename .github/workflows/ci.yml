name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Install OCR language data
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng fonts-noto-cjk
      - name: Install Chromium for visual renderer tests
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Lint security boundary imports and names
        run: ruff check --select F401,F821,F811 src/core/safe_http.py src/core/kb_sources.py src/core/hot_topics.py src/core/notify/__init__.py tests/test_access_and_sources.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build production frontend
        working-directory: web
        run: npm run build
      - name: Ensure demo mock API is excluded from production bundle
        working-directory: web
        run: |
          if grep -R -n -E "installDemoApi|__iwDemoApi" dist/assets; then
            echo "Demo mock API leaked into production assets"
            exit 1
          fi
      - name: Build isolated offline demo
        working-directory: web
        run: npm run build:demo
      - name: Verify offline demo artifact
        working-directory: web
        run: test -s ../iterwave-prototype.html && grep -q "静态原型演示" ../iterwave-prototype.html
